<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Code Search</title>
</head>
<body>
    <header>
        <h1>Code Search</h1>
        <p>encontre e explore linguagens de programação</p>
    </header>
    <main>
        <section class="pesquisa-section">
            <input type="text" placeholder="digite uma linguagem, categoria ou ano"
            id="campo-pesquisa">

            <div class="acoes">
                <button type="button" onclick="pesquisar()">Pesquisar</button>
                <button type="button" class="btn-filtro" id="btn-filtro"
                    onclick="alternarFiltros()" aria-expanded="false" aria-controls="filtro-painel">
                    Filtros
                    <span class="contador-filtros" id="contador-filtros"></span>
                    <span class="seta">▼</span>
                </button>
            </div>

            <div class="filtro-painel" id="filtro-painel">
                <h3>Filtrar por categoria</h3>
                <div class="filtros">
                    <label class="filtro-chip"><input type="checkbox" class="filtro-checkbox" value="Frontend" onchange="pesquisar()"><span>Frontend</span></label>
                    <label class="filtro-chip"><input type="checkbox" class="filtro-checkbox" value="Backend" onchange="pesquisar()"><span>Backend</span></label>
                    <label class="filtro-chip"><input type="checkbox" class="filtro-checkbox" value="Mobile" onchange="pesquisar()"><span>Mobile</span></label>
                    <label class="filtro-chip"><input type="checkbox" class="filtro-checkbox" value="IA" onchange="pesquisar()"><span>IA</span></label>
                    <label class="filtro-chip"><input type="checkbox" class="filtro-checkbox" value="Automacao" onchange="pesquisar()"><span>Automação</span></label>
                    <label class="filtro-chip"><input type="checkbox" class="filtro-checkbox" value="Games" onchange="pesquisar()"><span>Games</span></label>
                    <label class="filtro-chip"><input type="checkbox" class="filtro-checkbox" value="Desktop" onchange="pesquisar()"><span>Desktop</span></label>
                    <label class="filtro-chip"><input type="checkbox" class="filtro-checkbox" value="Enterprise" onchange="pesquisar()"><span>Enterprise</span></label>
                    <label class="filtro-chip"><input type="checkbox" class="filtro-checkbox" value="Web" onchange="pesquisar()"><span>Web</span></label>
                </div>
                <button type="button" class="btn-limpar" onclick="limparFiltros()">Limpar filtros</button>
            </div>
        </section>

        <section class="resultados-pesquisa"
        id="resultados-pesquisa">
        </section>
    </main>
    <footer>
        <p>2026 - Code Search. Todos os direitos reservados</p>
        <p>Entre em contato com o suporte email: reymondruan4@gmail.com</p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
