<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/public/styles/style.css">
    <title>Code Search</title>
</head>
<body>
    <header>
        <h1>Code Search</h1>
        <p>encontre e explore linguagens de programação</p>

        <section class="pesquisa-section">
            <div class="busca">
                <input type="text" placeholder="digite uma linguagem, categoria ou ano"
                id="campo-pesquisa" aria-label="Pesquisar linguagem">
                <button type="button" onclick="pesquisar()">Pesquisar</button>
            </div>

            <button type="button" class="btn-filtro" id="btn-filtro"
                onclick="alternarFiltros()" aria-expanded="false" aria-controls="filtro-painel">
                Filtros
                <span class="contador-filtros" id="contador-filtros"></span>
                <span class="seta">▼</span>
            </button>

            <div class="filtro-painel" id="filtro-painel">
                <h3>Filtrar por categoria</h3>
                <div class="filtros">
                    <label class="filtro-chip"><input type="checkbox" class="filtro-checkbox" value="Frontend" onchange="pesquisar()"><span>Frontend</span></label>
                    <label class="filtro-chip"><input type="checkbox" class="filtro-checkbox" value="Backend" onchange="pesquisar()"><span>Backend</span></label>
                    <label class="filtro-chip"><input type="checkbox" class="filtro-checkbox" value="Mobile" onchange="pesquisar()"><span>Mobile</span></label>
                    <label class="filtro-chip"><input type="checkbox" class="filtro-checkbox" value="Desktop" onchange="pesquisar()"><span>Desktop</span></label>
                    <label class="filtro-chip"><input type="checkbox" class="filtro-checkbox" value="Games" onchange="pesquisar()"><span>Games</span></label>
                    <label class="filtro-chip"><input type="checkbox" class="filtro-checkbox" value="IA" onchange="pesquisar()"><span>IA</span></label>
                    <label class="filtro-chip"><input type="checkbox" class="filtro-checkbox" value="Dados" onchange="pesquisar()"><span>Dados</span></label>
                    <label class="filtro-chip"><input type="checkbox" class="filtro-checkbox" value="Ciência" onchange="pesquisar()"><span>Ciência</span></label>
                    <label class="filtro-chip"><input type="checkbox" class="filtro-checkbox" value="Automação" onchange="pesquisar()"><span>Automação</span></label>
                    <label class="filtro-chip"><input type="checkbox" class="filtro-checkbox" value="Sistemas" onchange="pesquisar()"><span>Sistemas</span></label>
                    <label class="filtro-chip"><input type="checkbox" class="filtro-checkbox" value="Embarcados" onchange="pesquisar()"><span>Embarcados</span></label>
                    <label class="filtro-chip"><input type="checkbox" class="filtro-checkbox" value="Funcional" onchange="pesquisar()"><span>Funcional</span></label>
                    <label class="filtro-chip"><input type="checkbox" class="filtro-checkbox" value="Corporativo" onchange="pesquisar()"><span>Corporativo</span></label>
                    <label class="filtro-chip"><input type="checkbox" class="filtro-checkbox" value="Blockchain" onchange="pesquisar()"><span>Blockchain</span></label>
                </div>
                <button type="button" class="btn-limpar" onclick="limparFiltros()">Limpar filtros</button>
            </div>
        </section>
    </header>
    <main>
        <section class="resultados-pesquisa"
        id="resultados-pesquisa">
        </section>
    </main>
    <footer>
        <p>2026 - Code Search. Todos os direitos reservados</p>
        <p>Entre em contato com o suporte email: reymondruan4@gmail.com</p>
    </footer>
    <script src="/public/scripts/comum.js"></script>
    <script src="/public/scripts/app.js"></script>
</body>
</html>
